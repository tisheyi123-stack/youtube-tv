<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart YouTube TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #0b0c10;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 24px;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      background: #ff0033;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(255, 0, 51, 0.5);
    }
    .brand-icon svg {
      width: 26px;
      height: 26px;
      fill: #fff;
    }
    .brand-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .brand-title span {
      color: #ff0033;
    }
    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 6px 14px;
      width: 100%;
      max-width: 460px;
    }
    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.1rem;
      width: 100%;
    }
    .search-bar button {
      background: #ff0033;
      color: #fff;
      border: none;
      outline: none;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .search-bar button:hover, .search-bar button:focus {
      background: #d60029;
    }
    .categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar {
      display: none;
    }
    .cat-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ddd;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn:hover, .cat-btn:focus, .cat-btn.active {
      background: #ff0033;
      color: #fff;
      border-color: #ff0033;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 0, 51, 0.4);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      outline: none;
      display: flex;
      flex-direction: column;
    }
    .card:hover, .card:focus {
      transform: translateY(-6px) scale(1.02);
      border-color: #ff0033;
      box-shadow: 0 10px 30px rgba(255, 0, 51, 0.35);
      background: rgba(255, 255, 255, 0.07);
    }
    .thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #1a1a24;
    }
    .thumb-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .duration {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
      color: #f0f0f0;
    }
    .card-meta {
      font-size: 0.85rem;
      color: #888;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* Player Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      padding: 24px;
    }
    .modal.open {
      display: flex;
    }
    .modal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 16px;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .modal-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mirror-select {
      background: #1e1e2d;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
    }
    .close-btn {
      background: #ff0033;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
    }
    .close-btn:focus, .close-btn:hover {
      background: #d60029;
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
    }
    .player-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }
    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading-spinner {
      text-align: center;
      padding: 60px 0;
      font-size: 1.3rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 22c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 2c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>
      </div>
      <div class="brand-title">Smart <span>YouTube TV</span></div>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="جستجوی ویدیو یا کانال..." autocomplete="off">
      <button id="searchBtn" tabindex="0">جستجو</button>
    </div>
  </div>

  <div class="categories">
    <button class="cat-btn active" data-q="trending">🌟 ترند و داغ</button>
    <button class="cat-btn" data-q="موزیک ویدیو جدید">🎵 موزیک ویدیو جدید</button>
    <button class="cat-btn" data-q="آهنگ شاد ایرانی">🇮🇷 آهنگ شاد ایرانی</button>
    <button class="cat-btn" data-q="فوتبال خلاصه بازی">⚽ خلاصه بازی فوتبال</button>
    <button class="cat-btn" data-q="بررسی گوشی">📱 تکنولوژی و موبایل</button>
    <button class="cat-btn" data-q="انیمیشن دوبله فارسی">🍿 فیلم و کارتون</button>
    <button class="cat-btn" data-q="پادکست">🎙 پادکست فارسی</button>
  </div>

  <div id="videoGrid" class="grid">
    <div class="loading-spinner">در حال دریافت جدیدترین ویدیوها...</div>
  </div>

  <!-- Player Modal -->
  <div id="playerModal" class="modal">
    <div class="modal-bar">
      <div id="modalTitle" class="modal-title">عنوان ویدیو</div>
      <div class="modal-controls">
        <select id="mirrorSelect" class="mirror-select">
          <option value="piped">سرور ۱ (Piped CDN)</option>
          <option value="cf">سرور ۲ (Cloudflare Piped)</option>
          <option value="mha">سرور ۳ (MHA Server)</option>
        </select>
        <button id="closeModal" class="close-btn" tabindex="0">✕ بستن ویدیو</button>
      </div>
    </div>
    <div class="player-container">
      <iframe id="videoIframe" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    var currentVideoId = null;
    var grid = document.getElementById('videoGrid');
    var searchInput = document.getElementById('searchInput');
    var searchBtn = document.getElementById('searchBtn');
    var catBtns = document.querySelectorAll('.cat-btn');
    var modal = document.getElementById('playerModal');
    var modalTitle = document.getElementById('modalTitle');
    var videoIframe = document.getElementById('videoIframe');
    var closeModal = document.getElementById('closeModal');
    var mirrorSelect = document.getElementById('mirrorSelect');

    var MIRRORS = {
      piped: function(id) { return 'https://piped.video/embed/' + id + '?autoplay=1'; },
      cf: function(id) { return 'https://cf.piped.video/embed/' + id + '?autoplay=1'; },
      mha: function(id) { return 'https://piped.mha.fi/embed/' + id + '?autoplay=1'; }
    };

    function loadVideos(query) {
      grid.innerHTML = '<div class="loading-spinner">در حال بارگذاری ویدیوها...</div>';
      fetch('/api/search?q=' + encodeURIComponent(query))
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!data.items || data.items.length === 0) {
            grid.innerHTML = '<div class="loading-spinner">ویدیویی پیدا نشد!</div>';
            return;
          }

          var html = '';
          for (var i = 0; i < data.items.length; i++) {
            var item = data.items[i];
            html += '<div class="card" tabindex="' + (i + 1) + '" data-id="' + item.id + '" data-title="' + encodeURIComponent(item.title) + '">' +
              '<div class="thumb-wrap">' +
                '<img src="' + item.thumb + '" loading="lazy" alt="' + item.title + '">' +
                (item.duration ? '<div class="duration">' + item.duration + '</div>' : '') +
              '</div>' +
              '<div class="card-body">' +
                '<div class="card-title">' + item.title + '</div>' +
                '<div class="card-meta">' +
                  '<span>' + item.author + '</span>' +
                  '<span>' + item.views + '</span>' +
                '</div>' +
              '</div>' +
            '</div>';
          }
          grid.innerHTML = html;

          var cards = document.querySelectorAll('.card');
          cards.forEach(function(card) {
            card.addEventListener('click', function() {
              var vidId = card.getAttribute('data-id');
              var title = decodeURIComponent(card.getAttribute('data-title'));
              openPlayer(vidId, title);
            });
            card.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') card.click();
            });
          });
        })
        .catch(function(err) {
          grid.innerHTML = '<div class="loading-spinner">خطا در دریافت ویدیوها: ' + err.message + '</div>';
        });
    }

    function openPlayer(id, title) {
      currentVideoId = id;
      modalTitle.textContent = title;
      updatePlayerSource();
      modal.classList.add('open');
      closeModal.focus();
    }

    function closePlayer() {
      modal.classList.remove('open');
      videoIframe.src = '';
      currentVideoId = null;
    }

    function updatePlayerSource() {
      if (!currentVideoId) return;
      var mirror = mirrorSelect.value;
      var fn = MIRRORS[mirror] || MIRRORS.piped;
      videoIframe.src = fn(currentVideoId);
    }

    mirrorSelect.addEventListener('change', updatePlayerSource);
    closeModal.addEventListener('click', closePlayer);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' || e.key === 'Backspace') {
        if (modal.classList.contains('open')) {
          closePlayer();
          e.preventDefault();
        }
      }
    });

    searchBtn.addEventListener('click', function() {
      var q = searchInput.value.trim();
      if (q) {
        catBtns.forEach(function(b) { b.classList.remove('active'); });
        loadVideos(q);
      }
    });

    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchBtn.click();
    });

    catBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        catBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var q = btn.getAttribute('data-q');
        searchInput.value = '';
        loadVideos(q);
      });
    });

    // Initial load
    loadVideos('trending');
  </script>
</body>
</html>
